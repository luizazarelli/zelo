services:
    db:
        image: postgres:18
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_DB=${POSTGRES_DB}
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/18/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U user -d mydb']
            interval: 5s
            timeout: 5s
            retries: 5

    back-end:
        build: .
        env_file:
            - .env
        volumes:
            - .:/app
            - /app/node_modules
        depends_on:
            db:
                condition: service_healthy

volumes:
    pgdata:
