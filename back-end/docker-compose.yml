services:
    db:
        image: postgres:18
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_DB=${POSTGRES_DB}
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
    back-end:
        build: .
        env_file:
            - .env
        volumes:
            - .:/app
            - /app/node_modules
volumes:
    pgdata:
